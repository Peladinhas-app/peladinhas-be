server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://${PELADINHAS_DB_HOST}:${PELADINHAS_DB_PORT:5432}/${PELADINHAS_DB_NAME:postgres}?sslmode=${PELADINHAS_DB_SSL_MODE:require}
    username: ${PELADINHAS_DB_USER}
    password: ${PELADINHAS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
peladinhas:
  auth:
    provider: ${PELADINHAS_AUTH_PROVIDER:supabase}
    issuer-uri: ${PELADINHAS_AUTH_ISSUER_URI}
    jwk-set-uri: ${PELADINHAS_AUTH_JWK_SET_URI}
    audience: ${PELADINHAS_AUTH_AUDIENCE:authenticated}
  cors:
    allowed-origins: ${PELADINHAS_CORS_ALLOWED_ORIGINS}
