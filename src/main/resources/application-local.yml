spring:
  datasource:
    url: jdbc:postgresql://${PELADINHAS_DB_HOST:127.0.0.1}:${PELADINHAS_DB_PORT:55432}/${PELADINHAS_DB_NAME:peladinhas_dev}
    username: ${PELADINHAS_DB_USER:peladinhas_dev}
    password: ${PELADINHAS_DB_PASSWORD:peladinhas_dev_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
peladinhas:
  auth:
    provider: ${PELADINHAS_AUTH_PROVIDER:supabase}
    issuer-uri: ${PELADINHAS_AUTH_ISSUER_URI:}
    jwk-set-uri: ${PELADINHAS_AUTH_JWK_SET_URI:}
    audience: ${PELADINHAS_AUTH_AUDIENCE:authenticated}
