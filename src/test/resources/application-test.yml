    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
peladinhas:
  auth:
    provider: supabase
    issuer-uri:
    jwk-set-uri:
    audience: authenticated
