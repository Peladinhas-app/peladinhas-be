services:
  postgres:
    image: postgres:18.6
    container_name: peladinhas-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PELADINHAS_DB_NAME:-peladinhas_dev}
      POSTGRES_USER: ${PELADINHAS_DB_USER:-peladinhas_dev}
      POSTGRES_PASSWORD: ${PELADINHAS_DB_PASSWORD:-peladinhas_dev_password}
    ports:
      - "127.0.0.1:${PELADINHAS_DB_PORT:-55432}:5432"
    volumes:
      - peladinhas_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  peladinhas_postgres_data:
